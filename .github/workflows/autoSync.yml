name: "Upstream Sync"

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: upstream-sync
    cancel-in-progress: false

jobs:
    sync_latest_from_upstream:
        runs-on: ubuntu-latest
        name: Sync latest commits from upstream repo

        steps:
            - name: Checkout target repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Merge upstream
              id: merge
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/Vendicated/Vencord.git
                  git fetch upstream main
                  node scripts/mergeUpstream.mjs
                  if git rev-parse --verify -q MERGE_HEAD > /dev/null; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Install merged dependencies
              if: steps.merge.outputs.changed == 'true'
              run: pnpm install --frozen-lockfile

            - name: Validate merged tree
              if: steps.merge.outputs.changed == 'true'
              run: |
                  node --test scripts/mergeUpstream.test.mjs
                  pnpm test:ts
                  pnpm build --dev
                  pnpm buildStandalone --dev
                  pnpm buildWebStandalone --dev
                  pnpm lint
                  pnpm fmt:check
                  pnpm generatePluginJson

            - name: Commit and push validated merge
              if: steps.merge.outputs.changed == 'true'
              run: |
                  git commit --no-edit
                  git push origin HEAD:main
